<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD Team Randomizer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0d0a;
      --panel: #161b16;
      --panel-raised: #1d241d;
      --border: #2c352c;
      --border-light: #3c473c;
      --text: #e6ece6;
      --text-muted: #93a093;
      --text-dim: #6b766b;
      --accent: #b9f227;
      --accent-dim: #2a3310;
      --team1: #44c0ff;
      --team1-dim: #0f2738;
      --team2: #ff6b3d;
      --team2-dim: #38160c;
      --danger: #ff5151;
      --radius: 6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, #1a241a 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, #1a1f28 0%, transparent 45%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 28px 18px 60px;
    }

    .wrap { max-width: 920px; margin: 0 auto; }

    /* ---- Header ---- */
    header { text-align: center; margin-bottom: 28px; }
    header h1 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.1;
    }
    header h1 .hi { color: var(--accent); }
    header p {
      color: var(--text-dim);
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }

    .card h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .count {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 9px;
      border-radius: 20px;
    }

    button {
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      transition: transform .1s, background .15s, border-color .15s, color .15s, opacity .15s;
    }
    button:active { transform: translateY(1px); }

    /* ---- Roster buttons ---- */
    .roster {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .roster-btn {
      background: var(--panel-raised);
      border: 1.5px solid var(--border-light);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 30px;
      letter-spacing: .3px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 50px;
    }
    .roster-btn:hover { border-color: var(--text-dim); }
    .roster-btn.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #11160a;
    }
    .roster-btn.on:hover { background: #c9ff3d; }

    .add-row { display: flex; gap: 10px; margin-top: 16px; }
    input[type="text"] {
      flex: 1;
      background: var(--panel-raised);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text-dim); }
    .btn-add {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 14px;
      padding: 0 20px;
      letter-spacing: .5px;
    }
    .btn-add:hover { border-color: var(--accent); color: var(--accent); }

    /* ---- Actions ---- */
    .actions { display: flex; gap: 12px; margin-bottom: 22px; }
    .btn-random {
      flex: 1;
      background: linear-gradient(135deg, var(--accent), #8ec70f);
      color: #11160a;
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 16px;
    }
    .btn-random:hover { filter: brightness(1.07); }
    .btn-random:disabled { opacity: .4; cursor: not-allowed; filter: none; }
    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 14px;
      padding: 0 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-clear:hover { border-color: var(--danger); color: var(--danger); }

    /* ---- Teams ---- */
    .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .team {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .team.t1 { border-color: var(--team1); }
    .team.t2 { border-color: var(--team2); }
    .team-head {
      padding: 13px 16px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .t1 .team-head { background: var(--team1-dim); color: var(--team1); }
    .t2 .team-head { background: var(--team2-dim); color: var(--team2); }
    .team-head .num {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      opacity: .8;
      letter-spacing: 0;
    }
    .team-body { padding: 10px; display: flex; flex-direction: column; gap: 7px; min-height: 60px; }
    .player {
      background: var(--panel-raised);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-size: 15px;
      font-weight: 500;
      animation: pop .25s ease both;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px) scale(.98); }
      to { opacity: 1; transform: none; }
    }

    .placeholder {
      text-align: center;
      color: var(--text-dim);
      padding: 40px 20px;
      border: 1px dashed var(--border-light);
      border-radius: var(--radius);
      font-size: 14px;
    }

    @media (max-width: 560px) {
      body { padding: 18px 12px 50px; }
      header h1 { font-size: 26px; letter-spacing: 2px; }
      .card { padding: 16px; }
      .roster { grid-template-columns: 1fr 1fr; gap: 8px; }
      .roster-btn { font-size: 15px; padding: 14px 10px; }
      .teams { grid-template-columns: 1fr; }
      .btn-random { font-size: 18px; letter-spacing: 2px; }
      .actions { flex-wrap: wrap; }
    }
    @media (max-width: 340px) {
      .roster { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>COD <span class="hi">Team</span> Randomizer</h1>
      <p>Tap who&rsquo;s playing &middot; hit random</p>
    </header>

    <!-- Roster -->
    <div class="card">
      <h2>Who&rsquo;s Playing <span class="count" id="count">0</span></h2>
      <div class="roster" id="roster"></div>
      <div class="add-row">
        <input type="text" id="nameInput" placeholder="Add a guest&hellip;" autocomplete="off">
        <button class="btn-add" id="addBtn">Add</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-random" id="randomBtn" disabled>Randomize Teams</button>
      <button class="btn-clear" id="clearBtn">Clear</button>
    </div>

    <!-- Teams -->
    <div id="teamsArea">
      <div class="placeholder">Pick at least 2 players, then hit <b>Randomize Teams</b>.</div>
    </div>
  </div>

  <script>
    // Default roster shown as buttons.
    const ROSTER = ['PicklePizza', 'Wogga300', 'Tbaggs', 'Donnie', 'Mikeumstinks', 'Smeel', 'Campking'];

    // These two always end up on the same team. Kept internal — no UI hint.
    const PINNED = ['PicklePizza', 'Wogga300'];
    const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
    const PINNED_NORM = PINNED.map(norm);
    const isPinned = name => PINNED_NORM.includes(norm(name));

    // names currently on the roster (presets + any added guests)
    let roster = ROSTER.slice();
    // names toggled on
    let selected = new Set();

    const $ = id => document.getElementById(id);
    const rosterEl = $('roster');
    const countEl = $('count');
    const randomBtn = $('randomBtn');
    const teamsArea = $('teamsArea');
    const nameInput = $('nameInput');

    function renderRoster() {
      rosterEl.innerHTML = '';
      roster.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'roster-btn' + (selected.has(name) ? ' on' : '');
        btn.textContent = name;
        btn.addEventListener('click', () => toggle(name));
        rosterEl.appendChild(btn);
      });
      countEl.textContent = selected.size;
      randomBtn.disabled = selected.size < 2;
    }

    function toggle(name) {
      if (selected.has(name)) selected.delete(name);
      else selected.add(name);
      renderRoster();
    }

    function addGuest() {
      const raw = nameInput.value.trim();
      if (!raw) return;
      const existing = roster.find(n => norm(n) === norm(raw));
      if (existing) {
        selected.add(existing);
      } else {
        roster.push(raw);
        selected.add(raw);
      }
      nameInput.value = '';
      nameInput.focus();
      renderRoster();
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function randomize() {
      const playing = roster.filter(n => selected.has(n));
      if (playing.length < 2) return;

      const pinned = playing.filter(isPinned);
      const others = shuffle(playing.filter(n => !isPinned(n)));
      const n = playing.length;
      const p = pinned.length;

      // Balanced team sizes; randomly decide which side gets the extra
      // body when the count is odd.
      const big = Math.ceil(n / 2);
      const small = Math.floor(n / 2);
      let t1size, t2size;
      if (Math.random() < 0.5) { t1size = big; t2size = small; }
      else { t1size = small; t2size = big; }

      // The pinned pair travels together to a randomly chosen side —
      // but only a side big enough to hold them (matters for small/odd
      // lobbies). This makes them land on Team 1 or Team 2 unpredictably.
      const canHold = [];
      if (t1size >= p) canHold.push(1);
      if (t2size >= p) canHold.push(2);
      const pinnedTeam = canHold[Math.floor(Math.random() * canHold.length)];

      let team1 = [], team2 = [];
      if (pinnedTeam === 1) {
        team1 = pinned.slice();
        while (team1.length < t1size && others.length) team1.push(others.shift());
        team2 = others;
      } else {
        team2 = pinned.slice();
        while (team2.length < t2size && others.length) team2.push(others.shift());
        team1 = others;
      }

      // Shuffle each team's display order so the pinned pair doesn't
      // sit predictably together at the top.
      renderTeams(shuffle(team1), shuffle(team2));
    }

    function renderTeams(team1, team2) {
      teamsArea.innerHTML =
        '<div class="teams">' +
          teamHtml('t1', 'Team 1', team1) +
          teamHtml('t2', 'Team 2', team2) +
        '</div>';
    }

    function teamHtml(cls, title, list) {
      const body = list.length
        ? list.map(p => '<div class="player">' + escapeHtml(p) + '</div>').join('')
        : '<div class="placeholder" style="padding:20px;border:none;">Empty</div>';
      return '<div class="team ' + cls + '">' +
        '<div class="team-head">' + title +
          '<span class="num">' + list.length + ' player' + (list.length === 1 ? '' : 's') + '</span>' +
        '</div>' +
        '<div class="team-body">' + body + '</div>' +
      '</div>';
    }

    function clearSelection() {
      selected.clear();
      renderRoster();
      teamsArea.innerHTML =
        '<div class="placeholder">Pick at least 2 players, then hit <b>Randomize Teams</b>.</div>';
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---- Events ----
    $('addBtn').addEventListener('click', addGuest);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addGuest(); });
    randomBtn.addEventListener('click', randomize);
    $('clearBtn').addEventListener('click', clearSelection);

    renderRoster();
  </script>
</body>
</html>
